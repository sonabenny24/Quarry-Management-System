{% extends 'base.html' %}

{% block title %}Feedback & Dealer Reviews - Client{% endblock %}

{% block content %}
<div class="mb-4">
    <h3 class="fw-bold mb-1">Feedback & Dealer Reviews</h3>
    <p class="text-muted small">Share your experience with quarry suppliers or submit system suggestions</p>
</div>

<div class="row g-4 mb-5">
    <div class="col-md-6">
        <div class="card border-0 shadow-sm rounded-4 h-100">
            <div class="card-header bg-primary text-white p-3 fw-bold">
                <i class="fa-solid fa-star me-2"></i> Submit Dealer Review & Rating
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('client_feedback') }}">
                    <input type="hidden" name="action_type" value="review">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Select Quarry Supplier</label>
                        <select class="form-select" name="dealer_id" required>
                            {% for d in dealers %}
                            <option value="{{ d.user_id }}">{{ d.dealer_profile.company_name if d.dealer_profile else d.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Star Rating (1 to 5)</label>
                        <select class="form-select text-warning fw-bold" name="rating" required>
                            <option value="5">★★★★★ (5 - Excellent)</option>
                            <option value="4">★★★★☆ (4 - Very Good)</option>
                            <option value="3">★★★☆☆ (3 - Average)</option>
                            <option value="2">★★☆☆☆ (2 - Poor)</option>
                            <option value="1">★☆☆☆☆ (1 - Very Bad)</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Review Comments</label>
                        <textarea class="form-control" name="comment" rows="3" placeholder="Share your experience regarding material quality and prompt delivery..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary rounded-pill w-100 fw-bold">Submit Dealer Review</button>
                </form>
            </div>
        </div>
    </div>

    <div class="col-md-6">
        <div class="card border-0 shadow-sm rounded-4 h-100">
            <div class="card-header bg-dark text-white p-3 fw-bold">
                <i class="fa-solid fa-comment-dots me-2"></i> Submit Platform Feedback
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('client_feedback') }}">
                    <input type="hidden" name="action_type" value="feedback">
                    <div class="mb-3">
                        <label class="form-label fw-bold">System Rating</label>
                        <select class="form-select text-warning fw-bold" name="rating" required>
                            <option value="5">★★★★★ (5 - Outstanding System)</option>
                            <option value="4">★★★★☆ (4 - Good System)</option>
                            <option value="3">★★★☆☆ (3 - Moderate)</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Feedback / Suggestion</label>
                        <textarea class="form-control" name="message" rows="4" placeholder="Let us know how we can improve the web portal..." required></textarea>
                    </div>
                    <button type="submit" class="btn btn-dark rounded-pill w-100 fw-bold">Submit App Feedback</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
