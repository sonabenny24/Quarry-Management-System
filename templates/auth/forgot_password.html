{% extends 'base.html' %}

{% block title %}Forgot Password - Quarry Management System{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-5">
        <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
            <div class="card-header bg-dark text-white p-4 text-center border-0">
                <i class="fa-solid fa-key display-5 text-warning mb-2"></i>
                <h4 class="fw-bold mb-0">Reset Password</h4>
                <p class="text-muted small mb-0">Enter your account details to reset your password</p>
            </div>
            <div class="card-body p-4 p-md-5 bg-white">
                <form method="POST" action="{{ url_for('forgot_password') }}">
                    <div class="mb-3">
                        <label for="identifier" class="form-label fw-bold">Username or Email</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fa-solid fa-user text-muted"></i></span>
                            <input type="text" class="form-control" id="identifier" name="identifier" placeholder="Enter your username or email" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="new_password" class="form-label fw-bold">New Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fa-solid fa-lock text-muted"></i></span>
                            <input type="password" class="form-control" id="new_password" name="new_password" placeholder="Enter new password" minlength="4" required>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label for="confirm_password" class="form-label fw-bold">Confirm New Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fa-solid fa-lock text-muted"></i></span>
                            <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Confirm new password" minlength="4" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-warning btn-lg w-100 fw-bold shadow-sm rounded-3 text-dark">
                        <i class="fa-solid fa-rotate-left me-2"></i> Reset Password
                    </button>
                </form>

                <hr class="my-4">

                <div class="text-center">
                    <a href="{{ url_for('login') }}" class="fw-bold text-decoration-none">
                        <i class="fa-solid fa-arrow-left me-1"></i> Back to Login
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
